<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233f">
<title>台語小遊戲</title>
<style>
/* 外殼：上方是遊戲畫面（iframe），下方固定兩個分頁；各遊戲保有自己的配色與存檔 */
:root{--bar:#111a2e;--txt:#c9cfdc;--on:#f4b740;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bar);display:flex;flex-direction:column;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
iframe[hidden]{display:none}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{flex:1;font:inherit;background:none;border:0;color:var(--txt);padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;cursor:pointer;touch-action:manipulation}
nav button span{font-size:22px;line-height:1}
nav button[aria-selected="true"]{color:var(--on);font-weight:700}
nav button:focus-visible{outline:2px solid var(--on);outline-offset:-4px}
</style>
</head>
<body>
<main>
  <iframe id="f-yeshi" title="來去踅夜市・單詞練習" hidden></iframe>
  <iframe id="f-newyear" title="過年好話押韻王" hidden></iframe>
</main>
<nav role="tablist">
  <button role="tab" data-tab="yeshi" aria-controls="f-yeshi"><span>🏮</span>踅夜市單詞</button>
  <button role="tab" data-tab="newyear" aria-controls="f-newyear"><span>🧧</span>過年好話</button>
</nav>
<script>
// 分頁設定：src 第一次切過去才載入；切走時 iframe 只是藏起來，遊戲進度不會不見
const TABS = {
  yeshi:   { src: 'yeshi/',   color: '#16233f', title: '來去踅夜市・單詞練習' },
  newyear: { src: 'newyear/', color: '#8e1b20', title: '過年好話押韻王' }
};
const KEY = 'shell_tab';

function show(name) {
  if (!TABS[name]) name = 'yeshi';
  for (const [k, t] of Object.entries(TABS)) {
    const f = document.getElementById('f-' + k);
    const on = k === name;
    if (on && !f.src) f.src = t.src;
    f.hidden = !on;
    document.querySelector(`[data-tab="${k}"]`).setAttribute('aria-selected', on);
  }
  document.querySelector('meta[name=theme-color]').content = TABS[name].color;
  document.title = TABS[name].title;
  if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  try { localStorage.setItem(KEY, name); } catch (e) {}
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.tab));
window.addEventListener('hashchange', () => show(location.hash.slice(1)));

let start = location.hash.slice(1);
if (!TABS[start]) { try { start = localStorage.getItem(KEY); } catch (e) {} }
show(start);
</script>
</body>
</html>
