<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17120d">
<meta name="description" content="高中閩南語文課的台語學習小遊戲：單詞、押韻、台羅拼音，手機掃 QR Code 就能玩。">
<title>台語小遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* 大廳：廟口夜景。主角是「逐字標台羅」的標題；遊戲卡片用各遊戲的顏色，名稱同樣逐字標台羅
   漢字一律用霞鶩文楷（像課本楷體），台羅一律用 Noto Sans（聲調符號才完整）
   動態只留燈籠（搖晃＋閃爍）；手機單欄，電腦左側標題與 QR Code、右側兩欄卡片 */
:root{
  --night:#17120d; --gold:#f2b84b; --paper:#fbf3e4; --muted:#bfb19c; --ink:#2a1d12;
  --han:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --lo:"Noto Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{--lan-h:84px;--sky-h:150px;position:relative;overflow-x:hidden;margin:0;min-height:100vh;background:var(--night);color:var(--paper);font-family:var(--han);-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(242,184,75,.16),transparent 70%)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 逐字標音：台羅在字頂，像課本的注音排法 */
.ruby{display:inline-flex;flex-wrap:wrap;justify-content:inherit;gap:0 .06em}
.ch{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.ch i{font-style:normal;font-family:var(--lo);font-weight:400;font-size:max(11px,.26em);letter-spacing:0;margin-bottom:.32em;white-space:nowrap}

/* 背景：月娘、燈籠串、廟宇與夜市剪影，全部是程式畫的 SVG，不擋點擊 */
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.moon{position:absolute;top:10px;right:-26px;width:84px;height:84px;border-radius:50%;opacity:.8;
  background:radial-gradient(circle at 40% 38%,#fff4d6,#f3d38c 60%,#e2b45c);
  box-shadow:0 0 50px 12px rgba(247,217,142,.25)}
.rope{position:absolute;left:0;top:0;width:100%;height:var(--lan-h);overflow:visible}
.lan{position:absolute;width:var(--w);margin-left:calc(var(--w) / -2);transform-origin:50% 0;animation:sway var(--d) ease-in-out infinite alternate;animation-delay:var(--dl)}
.lan svg{position:relative;display:block;width:100%;height:auto;animation:flick-b var(--fd) linear infinite;animation-delay:var(--fdl)}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
/* 燈籠閃爍：外圈光暈忽明忽暗，燈籠本身亮度跟著跳，每盞節奏都不同 */
.lan .halo{position:absolute;left:50%;top:44%;width:270%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,var(--glow) 0,transparent 62%);animation:flicker var(--fd) linear infinite;animation-delay:var(--fdl)}
@keyframes flicker{0%,100%{opacity:.8}7%{opacity:.45}9%{opacity:.95}30%{opacity:.7}33%{opacity:1}55%{opacity:.75}57%{opacity:.4}60%{opacity:.9}82%{opacity:.7}}
@keyframes flick-b{0%,100%{filter:brightness(1)}7%{filter:brightness(.82)}9%{filter:brightness(1.12)}33%{filter:brightness(1.18)}57%{filter:brightness(.8)}60%{filter:brightness(1.08)}}
.sky{position:absolute;left:0;right:0;bottom:0;height:var(--sky-h)}
.sky svg{display:block;width:100%;height:100%}
.sky::before{content:"";position:absolute;left:10%;right:10%;bottom:0;height:140%;background:radial-gradient(ellipse 50% 60% at 50% 100%,rgba(242,140,60,.18),transparent 70%)}

.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;
  padding:calc(var(--lan-h) + 10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(var(--sky-h) + 8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* 標題區 */
.side{text-align:center}
h1{margin:0;font-weight:700;font-size:clamp(46px,14vw,64px);letter-spacing:.04em;color:var(--gold);justify-content:center;text-shadow:0 3px 0 rgba(0,0,0,.45)}
h1 .ruby{justify-content:inherit}
h1 .ch i{color:var(--muted);text-shadow:none;font-size:max(12px,.24em)}
.lead{margin:14px 0 0;font-size:17px;line-height:1.6}
.music{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:6px 14px 6px 10px;border-radius:6px;border:1px solid rgba(242,184,75,.45);background:transparent;color:var(--gold);font-size:15px}
.music:hover{border-color:var(--gold)}
.music[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;width:14px;height:13px}
.eq i{flex:1;height:30%;background:currentColor;border-radius:1px}
.music[aria-pressed="true"] .eq i{animation:eq .9s ease-in-out infinite alternate}
.music[aria-pressed="true"] .eq i:nth-child(2){animation-delay:-.3s;animation-duration:.7s}
.music[aria-pressed="true"] .eq i:nth-child(3){animation-delay:-.6s;animation-duration:1.1s}
@keyframes eq{from{height:25%}to{height:100%}}
.scan{display:none}

/* 遊戲卡片：遊戲本身的顏色當底，角落一個淡淡的大楷字當浮水印；名稱逐字標台羅 */
.signs{display:grid;gap:16px;margin-top:30px}
.sign{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:10px;padding:22px 22px 18px;border-radius:20px;
  background:var(--c);
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 80%,#fff 20%) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 72%,#000) 100%);
  border:1px solid rgba(255,255,255,.12);border-color:color-mix(in srgb,var(--a) 30%,transparent);
  box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);transition:border-color .2s}
.sign:hover,.sign:focus-within{border-color:var(--a)}
.sign .wm{position:absolute;right:-8px;bottom:-34px;z-index:-1;font-size:150px;font-weight:700;line-height:1;color:var(--a);opacity:.09;pointer-events:none}
.sign h2{margin:0;font-weight:700;font-size:30px;color:var(--a);letter-spacing:.03em}
.sign h2 .ch i{color:var(--paper);opacity:.72;font-size:12px}
.sign h2 a{text-decoration:none;display:block}
.sign h2 a::after{content:"";position:absolute;inset:0;z-index:1}
.sign h2 a:focus-visible{outline:none}
.sign:has(h2 a:focus-visible){outline:3px solid var(--a);outline-offset:3px}
.sign p{margin:0;font-size:16px;line-height:1.65;opacity:.92}
.sign .row{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:12px;border-top:1px dashed rgba(255,255,255,.2);font-size:14px}
.sign .st{flex:1;min-width:0;white-space:nowrap;opacity:.88}
.sign .st b{font-family:var(--lo);font-weight:500;font-size:17px;color:var(--a)}
.sign .go{flex:none;padding:7px 18px;border-radius:999px;background:var(--a);color:var(--c);font-weight:700;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.qr{display:none;position:relative;z-index:2;padding:6px 12px;border-radius:999px;border:1px solid rgba(251,243,228,.3);background:rgba(0,0,0,.18);font-size:13px;color:var(--paper)}
.qr:hover{border-color:var(--a);color:var(--a)}

footer{margin-top:30px;text-align:center;font-size:13px;line-height:1.7;color:var(--muted)}

/* QR Code 放大視窗：投影給全班掃 */
dialog{border:0;padding:0;border-radius:8px;background:var(--paper);color:var(--ink);width:min(92vw,460px);max-height:92vh;box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(10,7,4,.78)}
.dlg{padding:22px 22px 18px;text-align:center}
.dlg small{display:block;font-size:14px;color:#8a6d4a}
.dlg h2{margin:2px 0 14px;font-size:28px}
.dlg .code{width:min(100%,62vh,380px);margin:0 auto;aspect-ratio:1;background:#fff;border-radius:4px;padding:6px}
.dlg .code svg{display:block;width:100%;height:100%}
.dlg .url{margin:12px 0 0;font-family:var(--lo);font-size:13px;color:#6b5640;word-break:break-all}
.dlg .btns{display:flex;gap:10px;justify-content:center;margin-top:16px}
.dlg .btns button{padding:9px 18px;border-radius:6px;border:0;font-weight:700;font-size:15px}
.dlg .copy{background:var(--ink);color:var(--paper)}
.dlg .close{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}

@media (min-width:640px){
  .wrap{max-width:860px}
  .signs{grid-template-columns:1fr 1fr}
}
/* 電腦：左邊標題＋大 QR Code（老師投影用），右邊兩欄卡片；QR 按鈕只在電腦出現 */
@media (min-width:960px){
  body{--lan-h:118px;--sky-h:220px}
  .wrap{max-width:1180px;display:grid;grid-template-columns:330px 1fr;gap:64px;align-items:start;padding-left:40px;padding-right:40px;padding-bottom:110px}
  .moon{top:22px;right:6%;width:130px;height:130px}
  .sky{position:fixed}
  .side{position:sticky;top:48px;text-align:left}
  h1{font-size:58px;justify-content:flex-start}
  .scan{display:block;margin-top:30px;padding:16px;border-radius:6px;background:var(--paper);color:var(--ink);text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.4)}
  .scan .code{display:block;width:100%;aspect-ratio:1;border:0;padding:0;background:#fff;cursor:zoom-in}
  .scan .code svg{display:block;width:100%;height:100%}
  .scan b{display:block;margin-top:12px;font-size:19px}
  .scan span{display:block;margin-top:2px;font-size:14px;color:#6b5640}
  .signs{margin-top:44px}
  .qr{display:inline-block}
  main footer{text-align:left}
}
/* 系統設定「減少動態效果」：燈籠不搖，明暗閃爍保留 */
@media (prefers-reduced-motion:reduce){
  .lan{animation:none}
  .sign{transition:none}
  .music[aria-pressed="true"] .eq i{animation:none;height:70%}
}
</style>
</head>
<body>
<div class="deco" aria-hidden="true">
  <div class="moon"></div>
  <svg class="rope" id="rope" viewBox="0 0 1000 100" preserveAspectRatio="none"></svg>
  <div id="lanterns"></div>
  <div class="sky" id="sky"></div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="lanHi" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
    <symbol id="lanR" viewBox="0 0 40 70">
      <line x1="20" y1="0" x2="20" y2="9" stroke="#5a4128" stroke-width="1.5"/>
      <rect x="12.5" y="8" width="15" height="5" rx="1.5" fill="#e6b450"/>
      <ellipse cx="20" cy="31" rx="16" ry="19" fill="#d2402c"/><ellipse cx="20" cy="31" rx="16" ry="19" fill="url(#lanHi)"/>
      <g fill="none" stroke="rgba(60,10,5,.35)"><ellipse cx="20" cy="31" rx="10" ry="19"/><ellipse cx="20" cy="31" rx="4" ry="19"/></g>
      <text x="20" y="36.5" text-anchor="middle" font-size="14" font-family="serif" font-weight="700" fill="#ffd98a">福</text>
      <rect x="12.5" y="48" width="15" height="5" rx="1.5" fill="#e6b450"/>
      <path d="M17 53v11M20 53v15M23 53v11" stroke="#e6b450" stroke-width="1.4"/>
    </symbol>
    <symbol id="lanG" viewBox="0 0 40 70">
      <line x1="20" y1="0" x2="20" y2="9" stroke="#5a4128" stroke-width="1.5"/>
      <rect x="12.5" y="8" width="15" height="5" rx="1.5" fill="#b4372a"/>
      <ellipse cx="20" cy="31" rx="16" ry="19" fill="#f2b84b"/><ellipse cx="20" cy="31" rx="16" ry="19" fill="url(#lanHi)"/>
      <g fill="none" stroke="rgba(120,60,10,.35)"><ellipse cx="20" cy="31" rx="10" ry="19"/><ellipse cx="20" cy="31" rx="4" ry="19"/></g>
      <rect x="12.5" y="48" width="15" height="5" rx="1.5" fill="#b4372a"/>
      <path d="M17 53v11M20 53v15M23 53v11" stroke="#d2402c" stroke-width="1.4"/>
    </symbol>
  </defs>
</svg>
<div class="wrap">
  <aside class="side">
    <h1 id="title" aria-label="台語小遊戲"></h1>
    <p class="lead">揀一款，邊耍邊學台語。</p>
    <button class="music" id="music" aria-pressed="false"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="musicTxt">背景音樂：關</span></button>
    <div class="scan">
      <button class="code" id="siteCode" aria-label="放大 QR Code"></button>
      <b>手機掃一下就會當耍</b>
      <span>點一下放大，投影予全班掃</span>
    </div>
  </aside>
  <main>
    <h2 class="vh">遊戲</h2>
    <div class="signs" id="list"></div>
    <footer>錄音與部分詞條取自教育部《臺灣台語常用詞辭典》，<span style="white-space:nowrap">CC BY-ND 3.0 TW</span></footer>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg">
    <small>用手機掃 QR Code</small>
    <h2 id="dlgTitle"></h2>
    <div class="code" id="dlgCode"></div>
    <p class="url" id="dlgUrl"></p>
    <div class="btns"><button class="copy" id="dlgCopy">複製網址</button><button class="close" id="dlgClose">關閉</button></div>
  </div>
</dialog>

<script src="vendor/qrcode.js"></script>
<script src="games.js"></script>
<script src="music.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const GAMES = window.GAMES;

// 舊連結相容：之前的 #yeshi / #newyear 分頁網址直接轉進遊戲
const h = location.hash.slice(1);
if (GAMES.some(g => g.id === h)) location.replace('games/' + h + '/');

const siteUrl = new URL('./', location.href).href;
const gameUrl = g => new URL('games/' + g.id + '/', siteUrl).href;

// 逐字標台羅：字數跟音節數對得上才逐字標，對不上就整串放在上面
function ruby(han, lo) {
  const chars = [...han], syl = (lo || '').split(/[-\s]+/).filter(Boolean);
  if (chars.length !== syl.length) return `<span class="ruby"><span class="ch"><i lang="nan-Latn">${esc(lo || '')}</i>${esc(han)}</span></span>`;
  return '<span class="ruby">' + chars.map((c, k) => `<span class="ch"><i lang="nan-Latn">${esc(syl[k])}</i>${esc(c)}</span>`).join('') + '</span>';
}

// 從各遊戲自己存的成績算出最高分與次數
function stats(g) {
  if (!g.hist) return null;
  try {
    const xs = JSON.parse(localStorage.getItem(g.hist)) || [];
    return xs.length ? {n: xs.length, best: Math.max(...xs.map(r => +r.s || 0))} : null;
  } catch (e) { return null; }
}

// QR Code 畫成 SVG，投影放大也清楚
function qrSvg(text, label) {
  if (typeof qrcode !== 'function') return '';
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="${esc(label)}"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#17120d"/></svg>`;
}

$('#title').innerHTML = ruby('台語小遊戲', 'Tâi-gí sió iû-hì');
$('#list').innerHTML = GAMES.map((g, i) => {
  const st = stats(g);
  return `<article class="sign" style="--c:${esc(g.color)};--a:${esc(g.accent)}">
    ${g.mark ? `<span class="wm" aria-hidden="true">${esc(g.mark)}</span>` : ''}
    <h2><a href="games/${esc(g.id)}/" aria-label="${esc(g.name)}">${ruby(g.name, g.lo)}</a></h2>
    <p>${esc(g.desc)}</p>
    <div class="row"><span class="st">${st ? `最高 <b>${st.best}</b> 分，耍過 ${st.n} 擺` : ''}</span><button class="qr" data-qr="${i}" aria-label="顯示「${esc(g.name)}」的 QR Code">QR</button><span class="go" aria-hidden="true">開始</span></div>
  </article>`;
}).join('');

// ── 背景裝飾 ──
const desk = matchMedia('(min-width:960px)');

// 燈籠串：繩子是拋物線，燈籠掛在線上；寬度一變就重畫
function drawLanterns() {
  const W = innerWidth, big = desk.matches;
  const n = Math.max(5, Math.min(13, Math.round(W / (big ? 120 : 75))));
  const sag = 40;                           // 中央下垂（viewBox 高 100 的百分比）
  $('#rope').innerHTML = `<path d="M0 2Q500 ${2 + sag * 2} 1000 2" fill="none" stroke="#6b4c2c" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  let html = '';
  for (let k = 0; k < n; k++) {
    const x = (k + .5) / n, y = 2 + 4 * sag * x * (1 - x);
    const red = k % 2 === 0, w = (big ? 38 : 26) * (red ? 1 : .82);
    html += `<div class="lan" style="left:${(x * 100).toFixed(2)}%;top:calc(var(--lan-h) * ${(y / 100).toFixed(3)} - 2px);--w:${w}px;--d:${(2.6 + (k % 3) * .7).toFixed(1)}s;--dl:-${(k * .45).toFixed(2)}s;--fd:${(2.4 + Math.random() * 2.6).toFixed(2)}s;--fdl:-${(Math.random() * 4).toFixed(2)}s;--glow:${red ? 'rgba(235,85,50,.5)' : 'rgba(250,195,90,.45)'}"><i class="halo"></i><svg viewBox="0 0 40 70"><use href="#${red ? 'lanR' : 'lanG'}"/></svg></div>`;
  }
  $('#lanterns').innerHTML = html;
}


// 廟宇（燕尾脊）＋兩旁夜市攤仔的剪影；畫面窄時只露出中央的廟
function roof(cx, yb, W, H) {
  const L = cx - W, R = cx + W, yt = yb - H, rl = cx - W * .55, rr = cx + W * .55;
  const body = `M${L - W * .1} ${yb - H * .28}Q${L + W * .06} ${yb + 3} ${L + W * .3} ${yb + 2}L${R - W * .3} ${yb + 2}Q${R - W * .06} ${yb + 3} ${R + W * .1} ${yb - H * .28}Q${R - W * .1} ${yb - H * .35} ${rr} ${yt}L${rl} ${yt}Q${L + W * .1} ${yb - H * .35} ${L - W * .1} ${yb - H * .28}Z`;
  const ridge = `M${rl} ${yt + 4}L${rr} ${yt + 4}Q${rr + W * .12} ${yt + 2} ${rr + W * .26} ${yt - H * .55}Q${rr + W * .12} ${yt - H * .1} ${rr - W * .02} ${yt - 4}L${rl + W * .02} ${yt - 4}Q${rl - W * .12} ${yt - H * .1} ${rl - W * .26} ${yt - H * .55}Q${rl - W * .12} ${yt + 2} ${rl} ${yt + 4}Z`;
  const rim = `M${L - W * .1} ${yb - H * .28}Q${L + W * .1} ${yb - H * .35} ${rl} ${yt}M${rr} ${yt}Q${R - W * .1} ${yb - H * .35} ${R + W * .1} ${yb - H * .28}`;
  return `<path d="${body}${ridge}" fill="var(--sil)"/><path d="${rim}" fill="none" stroke="rgba(242,184,75,.28)" stroke-width="1.5"/>`;
}
function drawSky() {
  const G = 240, glow = (x, y, w, h, o) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#f2a64a" opacity="${o}"/>`;
  let s = `<svg viewBox="0 0 1440 ${G}" preserveAspectRatio="xMidYMax slice" style="--sil:#0b0805">`;
  // 遠山
  s += `<path d="M0 ${G}V170Q160 130 330 160T700 150T1060 155T1440 165V${G}Z" fill="#1c150e"/>`;
  // 夜市攤仔與燈串
  [[30, 0], [112, 1], [194, 2], [1166, 1], [1248, 0], [1330, 2]].forEach(([x, k]) => {
    s += `<path d="M${x - 6} 206L${x + 4} 190H${x + 66}L${x + 76} 206Z" fill="var(--sil)"/><rect x="${x}" y="205" width="70" height="${G - 205}" fill="var(--sil)"/>${glow(x + 9, 212, 52, 13, .22 + k * .06)}`;
  });
  for (const [a, b] of [[20, 290], [1150, 1420]]) {
    s += `<path d="M${a} 150Q${(a + b) / 2} 196 ${b} 150" fill="none" stroke="#3a2a18" stroke-width="1"/>`;
    for (let t = .06; t < 1; t += .08) {
      const x = a + (b - a) * t, y = 150 + 92 * t * (1 - t);
      const odd = Math.round(t * 12) % 2;
      s += `<circle cx="${x.toFixed(1)}" cy="${(y + 3).toFixed(1)}" r="3" fill="${odd ? '#f2b84b' : '#e2553c'}"/>`;
    }
  }
  // 樹影
  s += `<g fill="var(--sil)"><circle cx="300" cy="196" r="30"/><circle cx="326" cy="210" r="26"/><circle cx="1140" cy="200" r="28"/><circle cx="1116" cy="212" r="24"/></g>`;
  // 兩旁廂房
  for (const cx of [420, 1020]) s += `<rect x="${cx - 85}" y="185" width="170" height="${G - 185}" fill="var(--sil)"/>${glow(cx - 18, 200, 36, G - 200, .2)}${roof(cx, 187, 120, 34)}`;
  // 正殿（重簷）
  s += `<rect x="530" y="228" width="380" height="12" fill="var(--sil)"/><rect x="570" y="168" width="300" height="60" fill="var(--sil)"/><rect x="625" y="112" width="190" height="58" fill="var(--sil)"/>`;
  s += glow(690, 186, 60, 42, .38) + glow(612, 196, 36, 32, .2) + glow(792, 196, 36, 32, .2) + glow(660, 128, 22, 22, .25) + glow(758, 128, 22, 22, .25);
  s += roof(720, 170, 215, 46) + roof(720, 114, 150, 46);
  s += `<g fill="var(--sil)"><circle cx="720" cy="58" r="7"/><circle cx="720" cy="46" r="4.5"/><rect x="718.5" y="34" width="3" height="10"/></g>`;
  $('#sky').innerHTML = s + '</svg>';
}

drawLanterns(); drawSky();
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawLanterns, 150); });
desk.addEventListener('change', drawLanterns);

// ── 背景音樂 ──
// 瀏覽器不准網頁自己出聲，一定要先點一下；上次有開的話，這次點畫面任何地方就自動開始
const MKEY = 'hub_music', mBtn = $('#music');
function setMusic(on) {
  if (on) HubMusic.start(); else HubMusic.stop();
  mBtn.setAttribute('aria-pressed', on);
  $('#musicTxt').textContent = '背景音樂：' + (on ? '開' : '關');
  try { localStorage.setItem(MKEY, on ? '1' : '0'); } catch (e) {}
}
mBtn.onclick = () => setMusic(!HubMusic.playing());
let wantMusic = false;
try { wantMusic = localStorage.getItem(MKEY) === '1'; } catch (e) {}
if (wantMusic) {
  $('#musicTxt').textContent = '背景音樂：點畫面就開始';
  const first = e => {
    removeEventListener('pointerdown', first, true); removeEventListener('keydown', first, true);
    if (!mBtn.contains(e.target)) setMusic(true);
  };
  addEventListener('pointerdown', first, true); addEventListener('keydown', first, true);
}

// 放大 QR Code
const dlg = $('#dlg');
let dlgUrl = '';
function openQr(title, url) {
  dlgUrl = url;
  $('#dlgTitle').textContent = title;
  $('#dlgCode').innerHTML = qrSvg(url, title + ' 的 QR Code');
  $('#dlgUrl').textContent = url;
  $('#dlgCopy').textContent = '複製網址';
  if (dlg.showModal) dlg.showModal(); else location.href = url;
}
$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-qr]');
  if (b) { const g = GAMES[+b.dataset.qr]; openQr(g.name, gameUrl(g)); }
});
$('#siteCode').innerHTML = qrSvg(siteUrl, '台語小遊戲 QR Code');
$('#siteCode').onclick = () => openQr('台語小遊戲', siteUrl);
$('#dlgClose').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
$('#dlgCopy').onclick = async () => {
  try { await navigator.clipboard.writeText(dlgUrl); $('#dlgCopy').textContent = '已複製'; }
  catch (e) { $('#dlgCopy').textContent = '請手動複製'; }
};

// 從遊戲按「上一頁」回來時（bfcache），成績重新整理
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
