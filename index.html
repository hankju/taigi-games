<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1712">
<title>台語小遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 大廳：深色木頭底、米色字；每張卡片用該遊戲自己的配色，點了直接進遊戲 */
:root{
  --bg:#1b1712; --paper:#fff8ea; --muted:#cbbfae;
  --display:"LXGW WenKai TC","Kaiti TC","DFKai-SB",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--paper);font-family:var(--body);-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 50% 0,rgba(244,183,64,.14),transparent 45%)}
main{max-width:560px;margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
header{text-align:center;margin-bottom:18px}
h1{font-family:var(--display);font-size:clamp(34px,10vw,48px);margin:0;letter-spacing:.08em;color:#f4b740}
header p{margin:4px 0 0;color:var(--muted);font-size:15px}
.list{display:grid;gap:12px}
.game{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-decoration:none;color:var(--paper);
  background:var(--c);border-radius:16px;padding:16px;box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.game:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.game:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.game .ic{font-size:40px;text-align:center}
.game small{display:block;color:var(--a);font-size:13px;letter-spacing:.06em}
.game b{display:block;font-family:var(--display);font-size:24px;color:var(--a);line-height:1.25}
.game span p{margin:2px 0 0;font-size:14px;line-height:1.45;opacity:.85}
.game .go{font-size:24px;color:var(--a)}
footer{margin-top:20px;text-align:center;font-size:12px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<main>
  <header>
    <h1>台語小遊戲</h1>
    <p>揀一款來耍！</p>
  </header>
  <nav class="list" id="list"></nav>
  <footer>錄音與部分詞條取自教育部《臺灣台語常用詞辭典》，CC BY-ND 3.0 TW</footer>
</main>
<script src="games.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
document.getElementById('list').innerHTML = window.GAMES.map(g =>
  `<a class="game" href="games/${esc(g.id)}/" style="--c:${esc(g.color)};--a:${esc(g.accent)}">` +
  `<span class="ic">${esc(g.icon)}</span>` +
  `<span><small>${esc(g.tag)}</small><b>${esc(g.name)}</b><p>${esc(g.desc)}</p></span>` +
  `<span class="go">›</span></a>`
).join('');
// 舊連結相容：之前的 #yeshi / #newyear 分頁網址直接轉進遊戲
const h = location.hash.slice(1);
if (window.GAMES.some(g => g.id === h)) location.replace('games/' + h + '/');
</script>
</body>
</html>
